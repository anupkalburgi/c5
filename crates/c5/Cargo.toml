[package]
name = "c5"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Project memory for coding agents: plans, decisions and progress that outlive the chat"
keywords = ["cli", "agents", "memory", "decisions", "planning"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
c5-core = { version = "0.2.0", path = "../c5-core" }
c5-tui = { version = "0.2.0", path = "../c5-tui" }
c5-web = { version = "0.2.0", path = "../c5-web" }

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
